# directory path for mgif (should contain thousands of gene files (optionally) with the metadata)
mgifPath: https://hpc.nih.gov/~mcgaugheyd/mgif/Daniocell2023_SeuratV4/

# Primary tables and core columns
var:
  # gene info file
  file: https://hpc.nih.gov/~mcgaugheyd/mgif/Daniocell2023_SeuratV4/var.csv.gz

quant:
  # used for the "mgif" csv.gv gene level files in mgifPath
  # two required columns
  barcode: barcode
  expression: expression
  
obs:
  # cell metadata file
  file: https://hpc.nih.gov/~mcgaugheyd/mgif/Daniocell2023_SeuratV4/DanioCell_eye_20250828_2000hvg_200e_30l.obs.csv.gz
  columns:
    # barcode column
    ### WARNING! This is used to join to the quant$barcode above! #####
    barcode: V1
    # first embedding dimension
    embedding1: umap1
    # second embedding dimension
    embedding2: umap2
    # cell type column
    celltype: identity.super
    # cluster column
    cluster: cluster
    # total counts for the cell. Used for count norm in visualization.
    total_counts: nCount_RNA